ramen:
  blurb: "@ramenisthecure_"              # the small line in the Ramen panel
  text: >-
    Ramen is my favorite food, and since 2024 I've logged every shop I visit on Instagram,
    with what I ordered. Most of the bowls come from trips around Japan, plus a few from the
    US, Hong Kong and mainland China. At Jiro-style shops, my call is ヤサイマシニンニクアブラ.
  handle: "@ramenisthecure_"
  url: https://www.instagram.com/ramenisthecure_/
