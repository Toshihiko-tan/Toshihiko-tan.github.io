intro: Music, kendo, ramen and other things I do outside research.

music:
  blurb: Bands and radio                 # the small line in the Music panel
  text: >-
    I play bass and guitar in creSCendo at USC, and bass in Blue Records, a band based in
    Ann Arbor, Michigan. Before that, I hosted a radio show on KCSB-FM in Santa Barbara.
  links: []                              # recordings or videos, if you ever want to add some
