experience:
  - org: University of Southern California, Keck School of Medicine
    location: Los Angeles, CA
    detail: "PIs: Prof. Doc Edge, Prof. Charleston Chiang"
    dates: Current

  - org: University of Michigan, Department of Statistics
    location: Ann Arbor, MI
    detail: "PI: Prof. Jonathan Terhorst"
    dates: May 2025 – Jan 2026
    points:
      - >-
        Co-created [demestats](https://github.com/jthlab/demestats), a Python library for
        demographic inference; implemented a JAX-based optimizer that automates demographic
        parameter estimation, replacing manual visual calibration in earlier workflows.
        Co-author on the demestats paper.
      - >-
        Applied demestats to real datasets, including an internal unphased Michigan snake
        dataset, and took part in the Genomic History Inference Strategies Tournament (GHIST)
        using demestats to infer demographic parameters.

  - org: University of Michigan School of Public Health, Department of Biostatistics
    location: Ann Arbor, MI
    detail: "PI: Prof. Irina Gaynanova"
    dates: Aug 2024 – May 2025
    points:
      - >-
        Developed [Gluco-LLM](https://github.com/Toshihiko-tan/Gluco-LLM), a zero-shot LLM
        framework with retrieval-augmented generation (RAG) for CGM time-series forecasting,
        reducing error by up to 30% and compute time by 50% compared with strong time-series
        baselines.
      - >-
        Maintained and extended the [iglu](https://github.com/irinagain/iglu) R package for CGM
        analysis (bug fixes, new features, tests, documentation) and improved its Shiny-based
        visualization interface.
      - >-
        Curated and processed [Awesome-CGM](https://github.com/IrinaStatsLab/Awesome-CGM), a
        widely used public CGM dataset collection covering 1,000+ individuals with over 200 stars
        on GitHub. Coordinated analyses for a multi-institution consensus study with five external
        CGM software teams.

