# ---------------------------------------------------------------------------
# Publications, preprints, theses and datasets. The Research page groups them by
# year (newest first), and the CV page lists them as citations.
#
#   title      required
#   authors    required; a list of names. Your name (site.yaml → author_names) is bolded.
#              End a name with * for equal contribution, e.g. "Junyan Tan*".
#   year       required
#   venue      journal, conference, server or institution
#   note       optional badge, e.g. Preprint, In review, Thesis
#   url        optional link for the title (usually the DOI)
#   links      optional buttons, as "Label: url" (PDF, Code, Data, Slides, Poster ...)
#   abstract   optional; shown behind an "Abstract" button
#   bibtex     optional; shown behind a "BibTeX" button with a copy button
#   selected   true to feature it on the home page
#   draft      true to show it only in local preview, never on the live site
# ---------------------------------------------------------------------------

