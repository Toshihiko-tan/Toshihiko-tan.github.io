# ---------------------------------------------------------------------------
# Site-wide settings: name, links and the facts shown on the home page.
# The CV page draws on this file (education) and on cv.yaml (everything else).
# ---------------------------------------------------------------------------

name: Junyan (Samuel) Tan
role: PhD Student, Computational Biology and Bioinformatics
affiliation: University of Southern California
location: Los Angeles, CA

# Used for search results and link previews.
description: >-
  Junyan (Samuel) Tan is a PhD student in Computational Biology and Bioinformatics at the
  University of Southern California, working on population genetics, quantitative genetics
  and machine learning.

url: https://toshihiko-tan.github.io
lang: en

# Square photo in src/assets/img/.
photo: /assets/img/profile.jpg

# Spellings of your name as they appear in author lists.
# Any match is shown in bold on publication entries.
author_names:
  - Junyan Tan
  - J. Tan
  - Samuel Tan

# Links shown under your name. Leave a value empty ("") to hide it.
links:
  email: junyant@usc.edu
  scholar: ""      # Google Scholar profile URL
  orcid: https://orcid.org/0009-0005-9697-7696
  github: https://github.com/Toshihiko-tan
  linkedin: https://www.linkedin.com/in/samuel-tan-b00606221/
  bluesky: ""
  x: ""

# The "CV" button under your name points here (the web CV page).
cv: /cv/
# PDF version, shown on the CV page with a "Download PDF" button. To update it, replace
# src/assets/pdf/cv.pdf. Set this to "" to show only the web version.
cv_pdf: /assets/pdf/cv.pdf

# Navigation: the numbered menu at the top of every page.
# `draft: true` shows an item only in local preview.
nav:
  - title: About
    url: /
  - title: Research
    url: /research/
  - title: Blog
    url: /blog/
  - title: CV
    url: /cv/
  - title: Life
    url: /life/

# Tall numbered panels for the home page. NOT SHOWN at the moment (see partials/panels.njk).
# `blurb` is the small line in each panel (hidden on phones). Four fit best.
featured:
  - title: demestats
    blurb: Paper in Bioinformatics, 2026
    url: https://doi.org/10.1093/bioinformatics/btag511
  - title: Gluco-LLM
    blurb: LLMs for glucose forecasting
    url: https://github.com/Toshihiko-tan/Gluco-LLM
  - title: Awesome-CGM
    blurb: Open CGM datasets
    url: https://github.com/IrinaStatsLab/Awesome-CGM
  - title: CV
    blurb: Download the PDF
    url: /assets/pdf/cv.pdf

interests:
